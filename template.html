<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rally Pace Notes</title>
    <style>
        :root {
            --accent: #e8a000;
            --bg: #111;
            --surface: #1c1c1c;
            --border: #2e2e2e;
            --text: #f0f0f0;
            --muted: #888;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Courier New', Courier, monospace;
            background: var(--bg);
            color: var(--text);
            padding: 2rem;
        }

        header {
            border-bottom: 2px solid var(--accent);
            padding-bottom: 1rem;
            margin-bottom: 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
        }

        h1 {
            font-size: 1.1rem;
            font-weight: bold;
            color: var(--accent);
            max-width: 75%;
            line-height: 1.4;
        }

        .meta {
            font-size: 0.75rem;
            color: var(--muted);
            text-align: right;
        }

        .notes-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 0.3rem;
        }

        .pacenote {
            background: var(--surface);
            border-left: 3px solid var(--border);
            padding: 0.45rem 0.75rem;
            font-size: 1rem;
            line-height: 1.5;
            counter-increment: note;
        }

        .pacenote::before {
            content: counter(note) ". ";
            color: var(--muted);
            font-size: 0.75rem;
            margin-right: 0.25rem;
        }

        .notes-grid { counter-reset: note; }

        /* ── Print styles ─────────────────────────────── */
        @media print {
            body {
                background: #fff;
                color: #000;
                padding: 1cm;
                font-size: 11pt;
            }

            header { border-bottom-color: #000; }
            h1 { color: #000; font-size: 12pt; }
            .meta { color: #555; }

            .notes-grid {
                grid-template-columns: repeat(3, 1fr);
                gap: 2pt;
            }

            .pacenote {
                background: none;
                border-left: 2pt solid #ccc;
                padding: 3pt 6pt;
                font-size: 10pt;
                break-inside: avoid;
            }

            .pacenote::before { color: #999; }
        }
    </style>
</head>
<body>
    <header>
        <h1>Rally Pace Notes</h1>
        <div class="meta">Generated by GoRally &bull; gorally.py</div>
    </header>
    <div class="notes-grid">
        <!-- PACENOTES_PLACEHOLDER -->
    </div>
</body>
</html>
