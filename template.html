<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rally Pace Notes</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --accent: #e8a000;
            --bg: #0e0e0e;
            --text: #f0f0f0;
            --muted: #555;
            --divider: #2a2a2a;
        }

        body {
            font-family: 'Courier New', Courier, monospace;
            background: var(--bg);
            color: var(--text);
            height: 100vh;
            overflow: hidden;
        }

        /* ── Header ─────────────────────────────────────────── */
        #header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.6rem 1.5rem;
            border-bottom: 2px solid var(--accent);
        }

        #title {
            font-size: 0.95rem;
            color: var(--accent);
            font-weight: bold;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            max-width: 65%;
        }

        #nav {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        #page-counter {
            font-size: 0.8rem;
            color: var(--text);
            min-width: 4rem;
            text-align: center;
        }

        #nav button {
            background: none;
            border: 1px solid var(--muted);
            color: var(--text);
            padding: 0.2rem 0.65rem;
            cursor: pointer;
            font-family: inherit;
            font-size: 0.8rem;
        }
        #nav button:hover { border-color: var(--accent); color: var(--accent); }

        /* ── Page stage ─────────────────────────────────────── */
        #stage {
            position: relative;
            /* fills viewport minus header and hint */
            height: calc(100vh - 48px - 28px);
        }

        .page {
            display: none;
            position: absolute;
            inset: 0;
            /* center notes column */
            flex-direction: column;
            justify-content: space-evenly;
            align-items: center;
            padding: 2.5rem 2rem;
        }

        .page.active { display: flex; }

        .pacenote {
            width: 100%;
            max-width: 640px;
            font-size: 1.6rem;
            line-height: 1.4;
            display: flex;
            align-items: baseline;
            gap: 0.75rem;
            border-bottom: 1px solid var(--divider);
            padding-bottom: 0;
            justify-content: center;
            text-align: center;
        }

        .page .pacenote:last-child { border-bottom: none; }

        .note-num {
            font-size: 0.65rem;
            color: var(--muted);
            min-width: 1.6rem;
            text-align: right;
            flex-shrink: 0;
            padding-top: 0.2rem;
        }

        .note-text {
            flex: 1;
            outline: none;
            border-radius: 2px;
        }

        .note-text:focus {
            background: #1e1e1e;
            outline: 1px solid var(--accent);
        }

        /* ── Danger highlighting ─────────────────────────────── */
        .hl-caution { color: #ff3b3b; font-weight: bold; }
        .hl-care    { color: #ff8c69; font-weight: bold; }
        .hl-dont    { color: #ff3b3b; font-weight: bold; }

        /* ── Hint bar ────────────────────────────────────────── */
        #hint {
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.68rem;
            color: var(--muted);
        }

        /* ── Print ──────────────────────────────────────────── */
        @media print {
            body { background: #fff; color: #000; height: auto; overflow: visible; }
            #header, #stage, #hint { display: none; }
            #printout { display: block !important; }

            .print-page {
                page-break-after: always;
                padding: 1.5cm;
                font-family: 'Courier New', Courier, monospace;
                display: flex;
                flex-direction: column;
                justify-content: space-evenly;
                min-height: 24cm;
            }
            .print-page:last-child { page-break-after: auto; }

            .print-header {
                font-size: 9pt;
                color: #555;
                border-bottom: 1.5pt solid #000;
                padding-bottom: 4pt;
                margin-bottom: 8pt;
                display: flex;
                justify-content: space-between;
            }

            .print-notes { display: flex; flex-direction: column; flex: 1; justify-content: space-evenly; }

            .print-note {
                font-size: 14pt;
                line-height: 1.6;
                border-bottom: 0.5pt solid #ddd;
                padding: 2pt 0;
                display: flex;
                gap: 8pt;
                align-items: baseline;
            }
            .print-note:last-child { border-bottom: none; }

            .print-num {
                font-size: 7pt;
                color: #999;
                min-width: 18pt;
                text-align: right;
                flex-shrink: 0;
            }

            .hl-caution { color: #cc0000; font-weight: bold; }
            .hl-care    { color: #cc5500; font-weight: bold; }
            .hl-dont    { color: #cc0000; font-weight: bold; }
        }
    </style>
</head>
<body>

<div id="header">
    <div id="title">Rally Pace Notes</div>
    <div id="nav">
        <button onclick="changePage(-1)">&#8593; Prev</button>
        <span id="page-counter">1 / 1</span>
        <button onclick="changePage(1)">Next &#8595;</button>
        <button onclick="window.print()">Print</button>
    </div>
</div>

<div id="stage">
    <!-- PACENOTES_PLACEHOLDER -->
</div>

<div id="hint">&#8593; &#8595; arrow keys &nbsp;&middot;&nbsp; Ctrl+P to print</div>

<div id="printout" style="display:none"></div>

<script>
    const NOTES_PER_PAGE = 7;

    // Words to highlight and their CSS class
    const HIGHLIGHTS = [
        { pattern: /\bCAUTION\b/gi, cls: 'hl-caution' },
        { pattern: /\bCARE\b/gi,    cls: 'hl-care'    },
        { pattern: /\bDONT\b/gi,    cls: 'hl-dont'    },
        { pattern: /!/g,            cls: 'hl-caution'  },
    ];

    function highlightText(text) {
        // Returns an array of DOM nodes (spans + text nodes)
        const frag = document.createDocumentFragment();
        let remaining = text;

        while (remaining.length) {
            let earliest = null, earliestIdx = Infinity, earliestCls = '';

            for (const { pattern, cls } of HIGHLIGHTS) {
                pattern.lastIndex = 0;
                const m = pattern.exec(remaining);
                if (m && m.index < earliestIdx) {
                    earliest = m;
                    earliestIdx = m.index;
                    earliestCls = cls;
                }
            }

            if (!earliest) {
                frag.appendChild(document.createTextNode(remaining));
                break;
            }

            if (earliestIdx > 0)
                frag.appendChild(document.createTextNode(remaining.slice(0, earliestIdx)));

            const span = document.createElement('span');
            span.className = earliestCls;
            span.textContent = earliest[0];
            frag.appendChild(span);

            remaining = remaining.slice(earliestIdx + earliest[0].length);
        }

        return frag;
    }

    // Master list of edited note texts, kept in sync with contenteditable spans
    const noteTexts = [];

    function reHighlight(editSpan, idx) {
        const text = editSpan.textContent;
        noteTexts[idx] = text;
        // Rebuild highlighting without disturbing cursor
        // (we only re-render on blur to avoid cursor-jump issues)
    }

    function buildNote(index, text) {
        noteTexts[index] = text;

        const row = document.createElement('div');
        row.className = 'pacenote';

        const num = document.createElement('span');
        num.className = 'note-num';
        num.textContent = index + 1;
        row.appendChild(num);

        // Editable text span — highlighting applied on blur, raw text while editing
        const editSpan = document.createElement('span');
        editSpan.className = 'note-text';
        editSpan.contentEditable = 'true';
        editSpan.spellcheck = false;
        editSpan.appendChild(highlightText(text));

        editSpan.addEventListener('focus', () => {
            // Strip to plain text while editing so cursor works cleanly
            editSpan.textContent = noteTexts[index];
        });

        editSpan.addEventListener('blur', () => {
            const updated = editSpan.textContent.trim();
            noteTexts[index] = updated;
            editSpan.innerHTML = '';
            editSpan.appendChild(highlightText(updated));
        });

        editSpan.addEventListener('keydown', e => {
            if (e.key === 'Enter') { e.preventDefault(); editSpan.blur(); }
            // Prevent arrow keys from changing page while editing
            if (e.key === 'ArrowUp' || e.key === 'ArrowDown') e.stopPropagation();
        });

        row.appendChild(editSpan);
        return row;
    }

    // Collect raw notes injected by Python
    const raw = Array.from(document.querySelectorAll('#stage .pacenote')).map(n => n.textContent);

    // Build screen pages
    const stage = document.getElementById('stage');
    stage.innerHTML = '';

    const pages = [];
    for (let i = 0; i < raw.length; i += NOTES_PER_PAGE) {
        const page = document.createElement('div');
        page.className = 'page';
        raw.slice(i, i + NOTES_PER_PAGE).forEach((text, j) => page.appendChild(buildNote(i + j, text)));
        stage.appendChild(page);
        pages.push(page);
    }

    let current = 0;

    function showPage(n) {
        pages[current].classList.remove('active');
        current = Math.max(0, Math.min(n, pages.length - 1));
        pages[current].classList.add('active');
        document.getElementById('page-counter').textContent = `${current + 1} / ${pages.length}`;
    }

    function changePage(dir) { showPage(current + dir); }

    document.addEventListener('keydown', e => {
        if (e.key === 'ArrowDown' || e.key === 'PageDown') { e.preventDefault(); changePage(1); }
        if (e.key === 'ArrowUp'   || e.key === 'PageUp')   { e.preventDefault(); changePage(-1); }
    });

    showPage(0);

    // Build print pages — reads noteTexts at print time so edits are captured
    const printout = document.getElementById('printout');
    const titleText = document.getElementById('title').textContent;

    function buildPrintPages() {
        printout.innerHTML = '';
        const totalPages = Math.ceil(noteTexts.length / NOTES_PER_PAGE);
        for (let i = 0; i < noteTexts.length; i += NOTES_PER_PAGE) {
            const pp = document.createElement('div');
            pp.className = 'print-page';

            const ph = document.createElement('div');
            ph.className = 'print-header';
            ph.innerHTML = `<span>${titleText}</span><span>Page ${Math.floor(i/NOTES_PER_PAGE)+1} / ${totalPages}</span>`;
            pp.appendChild(ph);

            const pn = document.createElement('div');
            pn.className = 'print-notes';

            noteTexts.slice(i, i + NOTES_PER_PAGE).forEach((text, j) => {
                const row = document.createElement('div');
                row.className = 'print-note';
                const num = document.createElement('span');
                num.className = 'print-num';
                num.textContent = i + j + 1;
                row.appendChild(num);
                row.appendChild(highlightText(text));
                pn.appendChild(row);
            });

            pp.appendChild(pn);
            printout.appendChild(pp);
        }
    }

    window.addEventListener('beforeprint', buildPrintPages);
</script>
</body>
</html>
