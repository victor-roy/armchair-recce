<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Rally Pace Notes</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --accent: #ff69b4;
            --bg: #0e0e0e;
            --text: #f0f0f0;
            --muted: #555;
            --divider: #2a2a2a;
        }

        body {
            font-family: 'Courier New', Courier, monospace;
            background: var(--bg);
            color: var(--text);
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* ── Header ─────────────────────────────────────────── */
        #header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.6rem 1.5rem;
            border-bottom: 2px solid var(--accent);
        }

        #title {
            font-size: 0.95rem;
            color: var(--accent);
            font-weight: bold;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            flex: 1;
            min-width: 0;
            margin-right: 1rem;
        }

        #nav {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            flex-shrink: 0;
        }

        #nav button, #nav label { white-space: nowrap; }

        #page-counter {
            font-size: 0.8rem;
            color: var(--text);
            min-width: 4rem;
            text-align: center;
        }

        #nav button, #nav select {
            background: none;
            border: 1px solid var(--muted);
            color: var(--text);
            padding: 0.2rem 0.65rem;
            cursor: pointer;
            font-family: inherit;
            font-size: 0.8rem;
        }
        #nav button:hover { border-color: var(--accent); color: var(--accent); }
        #nav select { background: #1a1a1a; }

        /* ── Page stage ─────────────────────────────────────── */
        #stage {
            position: relative;
            flex: 1;
            min-height: 0;
        }

        .page {
            display: none;
            position: absolute;
            inset: 0;
            flex-direction: column;
            justify-content: space-evenly;
            align-items: flex-start;
            padding: 2.5rem 2rem 2.5rem 5vw;
        }

        .page.active { display: flex; }

        .pacenote {
            width: min(65vw, 900px);
            font-size: 1.6rem;
            line-height: 1.4;
            display: flex;
            align-items: baseline;
            gap: 0.75rem;
            border-bottom: 1px solid var(--divider);
            padding-bottom: 0;
            justify-content: flex-start;
            text-align: left;
        }

        .page .pacenote:last-child { border-bottom: none; }

        .note-num {
            font-size: 0.65rem;
            color: var(--muted);
            min-width: 1.6rem;
            text-align: right;
            flex-shrink: 0;
            padding-top: 0.2rem;
        }

        .note-text {
            flex: 1;
            outline: none;
            border-radius: 2px;
            cursor: default;
            font-variant: small-caps;
        }

        .note-text[contenteditable="true"] {
            background: #1e1e1e;
            outline: 1px solid var(--accent);
            cursor: text;
        }

        .note-actions {
            display: flex;
            gap: 0.25rem;
            opacity: 0;
            pointer-events: none;  /* invisible buttons must not catch taps */
            transition: opacity 0.15s;
            flex-shrink: 0;
        }
        @media (hover: hover) { .pacenote:hover .note-actions { opacity: 1; pointer-events: auto; } }
        .pacenote.selected .note-actions { opacity: 1; pointer-events: auto; }

        .note-actions button {
            background: none;
            border: 1px solid var(--muted);
            color: var(--muted);
            font-family: inherit;
            font-size: 0.95rem;
            padding: 0.2rem 0.5rem;
            cursor: pointer;
            line-height: 1;
        }
        .note-actions button:hover { border-color: var(--accent); color: var(--accent); }

        /* ── Severity highlighting ───────────────────────────── */
        .sev-1 { color: #ff1a1a; font-weight: bold; }
        .sev-2 { color: #ff8c00; font-weight: bold; }
        .sev-3 { color: #ffc19a; font-weight: bold; }

        /* ── Uncertain terms ─────────────────────────────────── */
        .uncertain { background: rgba(255, 210, 0, 0.25); color: #ffd700; font-style: italic; }

        /* ── Modifier superscript (+/-) ──────────────────────── */
        .modifier-sup { vertical-align: super; font-size: 0.65em; line-height: 0; }

        /* ── Hint bar ────────────────────────────────────────── */
        #hint {
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.68rem;
            color: var(--muted);
        }

        /* ── Mobile ─────────────────────────────────────────── */
        @media (max-width: 640px) {
            #header { flex-wrap: wrap; gap: 0.5rem; padding: 0.5rem 1rem; }
            #title { flex-basis: 100%; margin-right: 0; }
            #nav { width: 100%; flex-shrink: 1; justify-content: space-between; gap: 0.4rem; }
            #nav button { padding: 0.3rem 0.55rem; }
            #nav label { display: none; }
            #page-counter { min-width: 0; }
            #hint { display: none; }
            .page { padding: 1rem 1rem 1rem 0.5rem; }
            .pacenote { width: calc(100vw - 1.5rem); font-size: 1.4rem; }
        }

        /* ── Touch: controls in a bottom bar, within thumb reach ── */
        @media (pointer: coarse) {
            html, body { overscroll-behavior: none; }
            #header { display: contents; }
            #title {
                order: 1;
                flex: none;
                margin-right: 0;
                padding: 0.6rem 1rem;
                padding-top: max(0.6rem, env(safe-area-inset-top));
                border-bottom: 2px solid var(--accent);
            }
            #stage { order: 2; touch-action: pinch-zoom; }
            #nav {
                order: 3;
                width: 100%;
                justify-content: space-between;
                gap: 0.4rem;
                padding: 0.5rem 0.75rem;
                padding-bottom: max(0.5rem, env(safe-area-inset-bottom));
                border-top: 2px solid var(--accent);
            }
            #nav button { min-height: 44px; flex: 1; padding: 0 0.4rem; }
            #nav label { display: none; }
            #page-counter { min-width: 3.5rem; }
            #hint, #printout { order: 4; }
            #hint { display: none; }
            .note-actions button { min-width: 44px; min-height: 44px; }
        }

        /* ── Print ──────────────────────────────────────────── */
        @media print {
            body { background: #fff; color: #000; height: auto; overflow: visible; }
            #header, #stage, #hint { display: none; }
            #printout { display: block !important; }

            .print-page {
                page-break-after: always;
                padding: 1.5cm;
                font-family: 'Courier New', Courier, monospace;
                display: flex;
                flex-direction: column;
                justify-content: space-evenly;
                min-height: 24cm;
            }
            .print-page:last-child { page-break-after: auto; }

            .print-header {
                font-size: 9pt;
                color: #555;
                border-bottom: 1.5pt solid #000;
                padding-bottom: 4pt;
                margin-bottom: 8pt;
                display: flex;
                justify-content: space-between;
            }

            .print-notes { display: flex; flex-direction: column; flex: 1; justify-content: space-evenly; }

            .print-note {
                font-size: 14pt;
                line-height: 1.6;
                border-bottom: 0.5pt solid #ddd;
                padding: 2pt 0;
                display: flex;
                gap: 8pt;
                align-items: baseline;
                font-variant: small-caps;
            }
            .print-note:last-child { border-bottom: none; }

            .print-num {
                font-size: 7pt;
                color: #999;
                min-width: 18pt;
                text-align: right;
                flex-shrink: 0;
            }

            .sev-1 { color: #cc0000; font-weight: bold; }
            .sev-2 { color: #cc5500; font-weight: bold; }
            .sev-3 { color: #cc8855; font-weight: bold; }
            .uncertain { background: #fffacc; color: #887700; font-style: italic; }
            .modifier-sup { vertical-align: super; font-size: 0.65em; line-height: 0; }
        }
    </style>
</head>
<body>

<div id="header">
    <div id="title">
        Rally Pace Notes<!--YOUTUBE_LINK_PLACEHOLDER-->
    </div>
    <div id="nav">
        <label style="font-size:0.8rem;color:var(--muted)">Notes/page
            <input id="notes-per-page" type="number" min="1" max="20" value="7"
                style="width:3rem;background:#1a1a1a;border:1px solid var(--muted);color:var(--text);font-family:inherit;font-size:0.8rem;padding:0.2rem 0.3rem;text-align:center"
                onchange="rebuildPages(+this.value)">
        </label>
        <button onclick="changePage(-1)">&#8593; Prev</button>
        <span id="page-counter">1 / 1</span>
        <button onclick="changePage(1)">Next &#8595;</button>
        <button onclick="saveHTML()">Save</button>
        <button onclick="window.print()">Print</button>
    </div>
</div>

<div id="stage">
    <!-- PACENOTES_PLACEHOLDER -->
</div>

<div id="hint">arrow keys to navigate &nbsp;&middot;&nbsp; Ctrl+P to print</div>

<div id="printout" style="display:none"></div>

<script>
    const NOTES_PER_PAGE = 7;

    // Severity highlight patterns — injected by Python from the shorthand CSV
    const HIGHLIGHTS = [
        { pattern: /\[\?[^\]]*\]/g, cls: 'uncertain' },
        { pattern: /(?<=\d)[+\-]/g, cls: 'modifier-sup' },
        // {{CSV_HIGHLIGHTS}}
    ];

    function highlightText(text) {
        // Returns an array of DOM nodes (spans + text nodes)
        const frag = document.createDocumentFragment();
        let remaining = text;

        while (remaining.length) {
            let earliest = null, earliestIdx = Infinity, earliestCls = '';

            for (const { pattern, cls } of HIGHLIGHTS) {
                pattern.lastIndex = 0;
                const m = pattern.exec(remaining);
                if (m && m.index < earliestIdx) {
                    earliest = m;
                    earliestIdx = m.index;
                    earliestCls = cls;
                }
            }

            if (!earliest) {
                frag.appendChild(document.createTextNode(remaining));
                break;
            }

            if (earliestIdx > 0)
                frag.appendChild(document.createTextNode(remaining.slice(0, earliestIdx)));

            const span = document.createElement('span');
            span.className = earliestCls;
            span.textContent = earliest[0];
            frag.appendChild(span);

            remaining = remaining.slice(earliestIdx + earliest[0].length);
        }

        return frag;
    }

    // Master list of current note texts (updated on confirmed edit)
    const noteTexts = [];

    function setEditing(editSpan, index, enabled) {
        if (enabled) {
            editSpan.contentEditable = 'true';
            editSpan.dataset.before = noteTexts[index];
            editSpan.textContent = noteTexts[index];
            editSpan.focus();
            // Place cursor at end
            const range = document.createRange();
            range.selectNodeContents(editSpan);
            range.collapse(false);
            window.getSelection().removeAllRanges();
            window.getSelection().addRange(range);
        } else {
            editSpan.contentEditable = 'false';
        }
    }

    function confirmEdit(editSpan, index) {
        const updated = editSpan.textContent.trim();
        if (updated === '') {
            snapshot();
            noteTexts.splice(index, 1);
            rebuildPages(notesPerPage);
            return;
        }
        if (updated === noteTexts[index]) { setEditing(editSpan, index, false); return; }
        snapshot();
        noteTexts[index] = updated;
        editSpan.innerHTML = '';
        editSpan.appendChild(highlightText(updated));
        setEditing(editSpan, index, false);
    }

    function cancelEdit(editSpan, index) {
        editSpan.innerHTML = '';
        editSpan.appendChild(highlightText(noteTexts[index]));
        setEditing(editSpan, index, false);
    }

    function buildNote(index, text) {
        noteTexts[index] = text;

        const row = document.createElement('div');
        row.className = 'pacenote';
        // Tap a note to show its insert/delete buttons (touch has no hover)
        row.addEventListener('click', e => {
            if (e.target.closest('button')) return;
            document.querySelectorAll('.pacenote.selected').forEach(r => { if (r !== row) r.classList.remove('selected'); });
            row.classList.toggle('selected');
        });

        const num = document.createElement('span');
        num.className = 'note-num';
        num.textContent = index + 1;
        row.appendChild(num);

        const editSpan = document.createElement('span');
        editSpan.className = 'note-text';
        editSpan.contentEditable = 'false';
        editSpan.spellcheck = false;
        editSpan.appendChild(highlightText(text));

        editSpan.addEventListener('dblclick', () => {
            if (editSpan.contentEditable !== 'true') setEditing(editSpan, index, true);
        });

        editSpan.addEventListener('keydown', e => {
            if (editSpan.contentEditable !== 'true') return;
            if (e.key === 'Enter') { e.preventDefault(); confirmEdit(editSpan, index); }
            if (e.key === 'Escape') { e.preventDefault(); cancelEdit(editSpan, index); }
            if (e.key === 'ArrowUp' || e.key === 'ArrowDown') e.stopPropagation();
        });

        editSpan.addEventListener('blur', () => {
            if (editSpan.contentEditable === 'true') confirmEdit(editSpan, index);
        });

        row.appendChild(editSpan);

        const actions = document.createElement('div');
        actions.className = 'note-actions';

        const insertBtn = document.createElement('button');
        insertBtn.textContent = '+';
        insertBtn.title = 'Insert row after';
        insertBtn.addEventListener('click', () => {
            snapshot();
            noteTexts.splice(index + 1, 0, '');
            rebuildPages(notesPerPage);
            // enter edit mode on the new row after rebuild
            setTimeout(() => {
                const spans = document.querySelectorAll('.note-text');
                if (spans[index + 1]) setEditing(spans[index + 1], index + 1, true);
            }, 0);
        });

        const deleteBtn = document.createElement('button');
        deleteBtn.textContent = '×';
        deleteBtn.title = 'Delete row';
        deleteBtn.addEventListener('click', () => {
            if (!confirm('Delete this note?')) return;
            snapshot();
            noteTexts.splice(index, 1);
            rebuildPages(notesPerPage);
        });

        actions.appendChild(insertBtn);
        actions.appendChild(deleteBtn);
        row.appendChild(actions);
        return row;
    }

    // Collect raw notes injected by Python
    const raw = Array.from(document.querySelectorAll('#stage .pacenote')).map(n => n.textContent);

    // Build screen pages
    const stage = document.getElementById('stage');
    stage.innerHTML = '';

    const pages = [];
    for (let i = 0; i < raw.length; i += NOTES_PER_PAGE) {
        const page = document.createElement('div');
        page.className = 'page';
        raw.slice(i, i + NOTES_PER_PAGE).forEach((text, j) => page.appendChild(buildNote(i + j, text)));
        stage.appendChild(page);
        pages.push(page);
    }

    let current = 0;

    function showPage(n) {
        pages[current].classList.remove('active');
        current = Math.max(0, Math.min(n, pages.length - 1));
        pages[current].classList.add('active');
        document.getElementById('page-counter').textContent = `${current + 1} / ${pages.length}`;
    }

    function changePage(dir) { showPage(current + dir); }

    // ── Touch: swipe, or tap the outer edges, to change page ─────────────────
    // Middle taps are left alone so a note can be tapped (select) or double-tapped (edit).
    let touchStart = null;
    stage.addEventListener('touchstart', e => {
        const editing = document.querySelector('.note-text[contenteditable="true"]');
        if (e.touches.length !== 1 || editing) { touchStart = null; return; }
        const t = e.touches[0];
        touchStart = { x: t.clientX, y: t.clientY, target: e.target };
    }, { passive: true });

    stage.addEventListener('touchend', e => {
        if (!touchStart) return;
        const start = touchStart;
        touchStart = null;
        const t = e.changedTouches[0];
        const dx = t.clientX - start.x, dy = t.clientY - start.y;
        if (Math.max(Math.abs(dx), Math.abs(dy)) >= 50) {
            const d = Math.abs(dx) > Math.abs(dy) ? dx : dy;
            changePage(d < 0 ? 1 : -1);  // swipe left/up = next
            return;
        }
        if (start.target.closest('button')) return;
        const edge = window.innerWidth * 0.2;
        if (start.x > window.innerWidth - edge) { e.preventDefault(); changePage(1); }
        else if (start.x < edge) { e.preventDefault(); changePage(-1); }
    });

    document.addEventListener('keydown', e => {
        if (document.querySelector('.note-text[contenteditable="true"]')) return;
        if (e.key === 'ArrowDown' || e.key === 'ArrowRight' || e.key === 'PageDown') { e.preventDefault(); changePage(1); }
        if (e.key === 'ArrowUp'   || e.key === 'ArrowLeft'  || e.key === 'PageUp')   { e.preventDefault(); changePage(-1); }
    });

    showPage(0);

    // Build print pages — reads noteTexts at print time so edits are captured
    const printout = document.getElementById('printout');
    const titleText = document.getElementById('title').textContent;

    function buildPrintPages() {
        printout.innerHTML = '';
        const totalPages = Math.ceil(noteTexts.length / notesPerPage);
        for (let i = 0; i < noteTexts.length; i += notesPerPage) {
            const pp = document.createElement('div');
            pp.className = 'print-page';

            const ph = document.createElement('div');
            ph.className = 'print-header';
            ph.innerHTML = `<span>${titleText}</span><span>Page ${Math.floor(i/notesPerPage)+1} / ${totalPages}</span>`;
            pp.appendChild(ph);

            const pn = document.createElement('div');
            pn.className = 'print-notes';

            noteTexts.slice(i, i + notesPerPage).forEach((text, j) => {
                const row = document.createElement('div');
                row.className = 'print-note';
                const num = document.createElement('span');
                num.className = 'print-num';
                num.textContent = i + j + 1;
                row.appendChild(num);
                row.appendChild(highlightText(text));
                pn.appendChild(row);
            });

            pp.appendChild(pn);
            printout.appendChild(pp);
        }
    }

    window.addEventListener('beforeprint', buildPrintPages);

    // ── Undo stack ───────────────────────────────────────────────────────────
    const undoStack = [];

    function snapshot() {
        undoStack.push([...noteTexts]);
    }

    function undo() {
        if (!undoStack.length) return;
        const prev = undoStack.pop();
        noteTexts.length = 0;
        prev.forEach(t => noteTexts.push(t));
        rebuildPages(notesPerPage);
    }

    document.addEventListener('keydown', e => {
        if ((e.ctrlKey || e.metaKey) && e.key === 'z') {
            // Only intercept when no cell is actively being edited
            const editing = document.querySelector('.note-text[contenteditable="true"]');
            if (!editing) { e.preventDefault(); undo(); }
        }
    });

    // ── Notes-per-page ───────────────────────────────────────────────────────
    let notesPerPage = NOTES_PER_PAGE;

    function rebuildPages(n) {
        if (!n || n < 1) return;
        notesPerPage = n;
        stage.innerHTML = '';
        pages.length = 0;
        for (let i = 0; i < noteTexts.length; i += notesPerPage) {
            const page = document.createElement('div');
            page.className = 'page';
            noteTexts.slice(i, i + notesPerPage).forEach((text, j) => page.appendChild(buildNote(i + j, text)));
            stage.appendChild(page);
            pages.push(page);
        }
        showPage(current);
    }

    // ── Save ─────────────────────────────────────────────────────────────────
    function saveHTML() {
        // Flush all noteTexts back into the stage placeholders before serialising
        document.querySelectorAll('.note-text').forEach((el, i) => {
            el.innerHTML = '';
            el.appendChild(highlightText(noteTexts[i]));
            el.contentEditable = 'false';
        });

        document.querySelectorAll('.pacenote.selected').forEach(r => r.classList.remove('selected'));
        const html = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
        const blob = new Blob([html], { type: 'text/html' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'pacenotes.html';
        a.click();
        URL.revokeObjectURL(a.href);
    }
</script>
</body>
</html>
